services:
  ###########################################################
  # 🟦 BACKEND SERVICE (FastAPI)
  ###########################################################
  backend:
    build:
      context: ./back-end
      dockerfile: Dockerfile
    container_name: store-backend
    restart: always
    environment:
      DB_HOST: mysql8               
      DB_PORT: 3306                      
      DB_USER: root                    
      DB_PASSWORD: "1234"               
      DB_NAME: winning_solution      
    networks:
      - app-net

  ###########################################################
  # 🟩 FRONTEND BUILD SERVICE (React 빌드만 수행)
  ###########################################################
  frontend-build:
    build:
      context: ./front-end
      dockerfile: Dockerfile
    container_name: react-build
    restart: "no"
    volumes:
      - ./front-end/build:/app/build  # 빌드 결과물만 마운트
    networks:
      - app-net

  ###########################################################
  # 🟥 NGINX REVERSE PROXY (Frontend 제공 + Backend Proxy)
  ###########################################################
  nginx:
    image: nginx:latest
    container_name: store-nginx
    restart: always
    depends_on:
      - frontend-build
      - backend
    ports:
      - "80:80"
    volumes:
      - ./front-end/build:/usr/share/nginx/html
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - app-net

networks:
  app-net:
    driver: bridge
